services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333" # REST API & Web UI (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    healthcheck:
      # Official Qdrant image has no curl/wget; use bash /dev/tcp to hit /readyz
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  vectordb-server:
    image: vectordb-server:latest
    container_name: vectordb-server
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - ONNX_PROVIDERS=CUDAExecutionProvider
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MODELS_CACHE=/data/models
      - STORAGE_DIR=/data/uploaded_files
    volumes:
      - ./data:/data
      # - ./data/uploaded_files:/data/uploaded_files
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped