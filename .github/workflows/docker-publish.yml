name: Publish Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: cu118
            base_image: nvidia/cuda:11.8.0-cudnn8-runtime-ubuntu22.04
            ort_gpu_spec: "onnxruntime-gpu==1.18.1"
          - tag: cu124
            base_image: nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04
            ort_gpu_spec: "onnxruntime-gpu==1.20.1"
          - tag: cu126
            base_image: nvidia/cuda:12.6.3-cudnn-runtime-ubuntu22.04
            ort_gpu_spec: "onnxruntime-gpu==1.23.2"
          

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: meta
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vectordb-server:latest
