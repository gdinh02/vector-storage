name: Publish Docker Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: cu118
            base_image: nvidia/cuda:11.8.0-cudnn8-runtime-ubuntu22.04
            ort_gpu_spec: "onnxruntime-gpu==1.18.1"
          - tag: cu124
            base_image: nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04
            ort_gpu_spec: "onnxruntime-gpu==1.20.2"
          - tag: cu126
            base_image: nvidia/cuda:12.6.3-cudnn-runtime-ubuntu22.04
            ort_gpu_spec: "onnxruntime-gpu==1.23.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: meta
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.tag }}
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            ORT_GPU_SPEC=${{ matrix.ort_gpu_spec }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ matrix.tag }}
            ${{ steps.meta.outputs.image }}:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}